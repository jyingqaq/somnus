<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- interactive-widget：安卓键盘弹出时收缩布局视口，底部评论栏才会跟着键盘上移 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f3f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>somnus</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- 图标统一放 icons/，命名 icon-<尺寸>.png；a783.gif 是生成源图，留原名 -->
<link rel="icon" type="image/gif" href="icons/a783.gif">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="alternate icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="backdrop">
    <div class="bg" data-section="home"></div>
    <div class="bg" data-section="shelf"></div>
    <div class="bg" data-section="me"></div>
  </div>
  <div id="app">
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="layer-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
